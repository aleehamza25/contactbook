<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Book</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full screen height */
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .center-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        input, button, a {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        
        {% if user.is_authenticated %}
    <p>Welcome, {{ user.username }} | <form action="{% url 'logout' %}" method="post">
         {% csrf_token %} <button type="submit">Logout </button>
    </form>
    </p>
    {% else %}
    <p><a href="{% url 'login' %}">Login</a> | <a href="{% url 'register' %}">Register</a></p>
    {% endif %}


        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
